plugins {
    id 'com.android.application'
}

android {
    namespace 'il.family.budget'
    compileSdk 35
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'il.family.budget'
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName '1.5'
    }

    // קובצי האפליקציה (HTML/JS) נלקחים ישירות מתיקיית www
    sourceSets {
        main.assets.srcDirs = ['../../www']
    }
    // תיקיית apk (הגרסה המפורסמת להורדה) לא נארזת בתוך האפליקציה
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:!apk'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

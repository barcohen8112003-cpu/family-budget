plugins {
    id 'com.android.application'
}

android {
    namespace 'il.family.budget'
    compileSdk 35
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'il.family.budget'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    // שתי מהדורות של אותה אפליקציה (אותו מזהה, כך שאחת מתקינה מעל השנייה והנתונים נשמרים):
    // lite  - בלי קריאת התראות; מתקינה מכל מקור בלי חסימה של Play Protect
    // full  - עם קריאת התראות על עסקאות
    flavorDimensions 'edition'
    productFlavors {
        lite {
            dimension 'edition'
            buildConfigField 'boolean', 'NOTIF', 'false'
        }
        full {
            dimension 'edition'
            buildConfigField 'boolean', 'NOTIF', 'true'
        }
    }
    buildFeatures {
        buildConfig true
    }

    // קובצי האפליקציה (HTML/JS) נלקחים ישירות מתיקיית www
    sourceSets {
        main.assets.srcDirs = ['../../www']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
